services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediadms_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # host.docker.internal заработает благодаря extra_hosts ниже
      - DATABASE_URL=postgres://admin:access@host.docker.internal:5531/media_dms_db?sslmode=disable
      - RUST_LOG=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
